# 3.5 Logging configuration file

# Log to file handler
handlers=java.util.logging.FileHandler, java.util.logging.ConsoleHandler

# 3.5 Set global level to FINER or higher
.level=FINER

# 3.5 FileHandler configuration - log to log directory
# Pattern: log/java0.log, log/java1.log, etc.
java.util.logging.FileHandler.pattern=log/java%g.log

# 3.5 Maximum size per log file: 10KB (10000 bytes)
java.util.logging.FileHandler.limit=10000

# 3.5 Keep only the 4 most recent log files
java.util.logging.FileHandler.count=4

# Append to existing log files
java.util.logging.FileHandler.append=true

# Use XML formatter for file output
java.util.logging.FileHandler.formatter=java.util.logging.XMLFormatter

# FileHandler logs FINER and higher
java.util.logging.FileHandler.level=FINER

# 3.7 ConsoleHandler uses custom SmallLogFormatter
java.util.logging.ConsoleHandler.formatter=be.kdg.logging.SmallLogFormatter

# ConsoleHandler logs FINER and higher
java.util.logging.ConsoleHandler.level=FINER